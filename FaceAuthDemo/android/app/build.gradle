apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]
    //
    // Empty list = bundle the JS into EVERY variant, including debug. Normally
    // debug skips bundling and pulls JS from Metro over USB, which makes the app
    // unusable without a tethered laptop. Release builds cannot detect faces on
    // this device (MLKit fails to initialize its bundled model — see the
    // androidResources.noCompress note below and FaceDetector logcat), so the
    // debug variant is what actually works; embedding the bundle makes it
    // standalone and demo-safe.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []
    //
    // Metro forks a worker pool to transform modules. On this low-RAM build
    // machine that fork fails outright ("Failed to construct transformer: Error:
    // spawn UNKNOWN"), taking the whole bundle task with it. One worker is slower
    // but does not need the extra processes.
    extraPackagerArgs = ["--max-workers=1"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 *
 * DISABLED: R8 broke on-device face detection in release builds while debug builds
 * (which never minify) worked. VisionCamera resolves frame-processor plugins
 * reflectively by name, and the R8 mapping for the previous release APK showed it
 * renaming `VisionCameraFaceDetectorPlugin` -> `n4.g` and dropping
 * `VisionCameraFaceDetectorPluginKt` outright. The symptom is silent: the detector
 * simply returns no faces, so every camera screen sits on "Center your face in the
 * circle" forever, with no crash and no error.
 *
 * proguard-rules.pro now carries the keep rules this stack needs, but they are
 * unverified on-device. Re-enable only alongside a real device test of both enroll
 * and verify — a release build that boots proves nothing here, since the failure is
 * confined to the frame processor.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Keep ML model assets UNCOMPRESSED so they can be memory-mapped at runtime.
    //
    // MLKit's bundled face detector ships assets/models_bundled/blazeface.tfl plus
    // .emd classifier models. AGP's default noCompress list covers ".tflite" but
    // NOT ".tfl"/".emd", so release builds deflated them and the native loader got
    // a null model:
    //   Could not initialize face detector v2: RET_CHECK failure
    //   (face_detector_tflite_client.cc:92) model_ != nullptr (0x0 vs. nullptr)
    // The plugin swallows that exception and returns an empty face list, so the
    // only visible symptom was every camera screen sitting on "Center your face in
    // the circle" forever. Debug builds skip asset compression, which is why this
    // reproduced ONLY in release.
    androidResources {
        noCompress += ["tfl", "emd", "pb", "tflite"]
    }

    namespace "com.faceauthdemo"
    defaultConfig {
        applicationId "com.faceauthdemo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            // Gradle rejects resource shrinking without code shrinking, so this
            // tracks enableProguardInReleaseBuilds rather than being hardcoded.
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        excludes = [
            "META-INF/*.kotlin_module",
            "META-INF/**/*.pro",
            "META-INF/MANIFEST.MF"
        ]
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == "release") {
        variant.mergeAssetsProvider.configure {
            doLast {
                def assetsDir = outputDir.get().asFile
                println "Cleaning unused assets from: ${assetsDir}"
                delete(fileTree(dir: assetsDir, includes: [
                    "**/fssd_25_8bit_gray_v2.tflite",
                    "**/fssd_25_8bit_v2.tflite",
                    "**/fssd_medium_8bit_gray_v5.tflite",
                    "**/fssd_anchors_v2.pb",
                    "**/MFT_fssd_accgray.pb",
                    "**/MFT_fssd_fastgray.pb",
                    "**/contours.tfl",
                    "**/LMprec_600.emd"
                ]))
            }
        }
    }
}
